name: Native Linux build, package and installation verification

on:
  workflow_call:
    inputs:
      build-id:
        description: Controlled native build ID (gnu-x86_64 or arch-x86_64).
        required: true
        type: string
    secrets:
      MIYU_SMOKE_PROVIDER_CONFIG:
        description: Dedicated cline/deepseek-v4.1-flash test provider configuration.
        required: true

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-linux-inputs
          path: out/downloads
      - name: Restore the frozen source and prepared input modes
        run: python3 packaging/ci/workflow.py unpack --archive out/downloads/frozen-linux-inputs.tar.gz --out out/ci-release
      - name: Build and package in the fixed native container
        env:
          NATIVE_BUILD_ID: ${{ inputs.build-id }}
        run: python3 packaging/ci/workflow.py build --root out/ci-release --build-id "$NATIVE_BUILD_ID" --out out/ci-build
      - name: Install on every mapped distribution and call the dedicated live provider
        env:
          NATIVE_BUILD_ID: ${{ inputs.build-id }}
          MIYU_SMOKE_PROVIDER_CONFIG: ${{ secrets.MIYU_SMOKE_PROVIDER_CONFIG }}
        run: python3 packaging/ci/workflow.py verify --root out/ci-release --build-id "$NATIVE_BUILD_ID" --out out/ci-build
      - name: Archive packages and actual reports without credentials
        env:
          NATIVE_BUILD_ID: ${{ inputs.build-id }}
        run: python3 packaging/ci/workflow.py bundle --kind results --root out/ci-build --out "out/results-$NATIVE_BUILD_ID.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-results-${{ inputs.build-id }}
          path: out/results-${{ inputs.build-id }}.tar.gz
          compression-level: 0
          if-no-files-found: error
      - name: Preserve failure logs without credentials or build caches
        if: failure()
        env:
          NATIVE_BUILD_ID: ${{ inputs.build-id }}
        run: python3 packaging/ci/workflow.py bundle --kind diagnostics --root out/ci-build --out "out/failure-$NATIVE_BUILD_ID.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: failed-results-${{ inputs.build-id }}
          path: out/failure-${{ inputs.build-id }}.tar.gz
          compression-level: 0
          if-no-files-found: error
